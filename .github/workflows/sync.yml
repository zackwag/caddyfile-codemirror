name: Sync Caddyfile vocabulary

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Update to latest rouge-lexer-caddyfile
        run: bundle update rouge-lexer-caddyfile

      - name: Generate CodeMirror mode from latest gem
        run: bundle exec ruby script/generate.rb

      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- dist/ Gemfile.lock; then
            echo "No vocabulary changes."
            exit 0
          fi
          version=$(cat dist/VERSION)
          branch="sync/v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add dist/ Gemfile.lock
          git commit -m "chore(sync): update rouge-lexer-caddyfile to v${version}"
          git push origin "$branch"

          gh pr create --title "chore(sync): update rouge-lexer-caddyfile to v${version}" \
            --body "Automated daily vocabulary sync." --base main --head "$branch"

          # PRs opened with the default GITHUB_TOKEN are treated as
          # first-time-contributor PRs, so workflow runs they trigger (e.g.
          # the required "Conventional Commits" check) sit in
          # "action_required" until approved. Approve any such runs for this
          # branch so the required check actually executes.
          sleep 5
          for i in $(seq 1 10); do
            run_ids=$(gh api "repos/$REPO/actions/runs?event=pull_request&status=action_required" \
              -q ".workflow_runs[] | select(.head_branch==\"$branch\") | .id")
            if [ -n "$run_ids" ]; then
              for run_id in $run_ids; do
                gh api -X POST "repos/$REPO/actions/runs/$run_id/approve" || true
              done
              break
            fi
            sleep 5
          done

          # Let GitHub's native auto-merge wait for required checks and
          # merge once they pass, instead of polling for status ourselves.
          # If a check fails, the PR is simply left open for review.
          gh pr merge "$branch" --squash --delete-branch --auto
