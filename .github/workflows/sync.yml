name: Sync Caddyfile vocabulary

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Generate CodeMirror mode from latest gem
        run: bundle exec ruby script/generate.rb

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- dist/; then
            echo "No vocabulary changes."
            exit 0
          fi
          version=$(cat dist/VERSION)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "sync: rouge-lexer-caddyfile v${version}"
          git push
